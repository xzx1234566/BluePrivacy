name: Build BluePrivacy LSPosed APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Verify local-only manifest and source
        run: |
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo "INTERNET permission must not be present"
            exit 1
          fi
          if grep -R -nE 'okhttp3|retrofit2|HttpURLConnection|java\.net\.Socket|WebSocket' app/src/main/java; then
            echo "Network client code must not be present"
            exit 1
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BluePrivacy-LSPosed-1.4
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
