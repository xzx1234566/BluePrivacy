plugins { id 'com.android.application' }

android {
    namespace 'dev.blueprivacy'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.blueprivacy'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '1.4'
    }
}

dependencies {
    // Compile-time only; the Xposed API library is not packaged into the APK.
    compileOnly 'de.robv.android.xposed:api:82'
}
